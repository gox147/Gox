# ─────────────────────────────────────────────────────────────────────────────
# GPU 呈现跑批：gfx/gpu 三轨核销 + 4K 呈现基准 + 像素级 A/B + G-4 视觉闸门
# （26 组件 CPU vs GPU 双轨快照，snapshot_ab_test.go，2026-11-18 接入）
#
# 为什么需要这个文件：G-1 核销时确认 CI 此前没有任何 -tags gpu 跑批 ——
# gfx/gpu 的单元测试与像素级 A/B 只靠本地手跑，回归无人钉住。本工作流把
# 它们搬进 CI，同时执行口径纪律：
#
#   - ubuntu-latest 没有 GPU 硬件，wgpu 轨只拿软件适配器 —— **兜底口径**：
#     数字不进 bench-all.sh 的 nightly 闸门、不对外；它钉住的是
#     「像素零退化」与「不比现状回退」两条回归线，不是性能数字。
#   - 硬件数字的接入位：`hardware` job 用仓库变量 GPU_HARDWARE_RUNNER 守卫
#     （Settings → Variables → Actions 置 true 才启用）。不能只靠 self-hosted
#     runs-on 标签守卫 —— 仓库没有 [gpu-hardware] runner 时标签不匹配会让
#     job 停在 queued 直到 timeout 报红，而不是自动 skip（2026-11-15 首跑
#     实测踩中，f6c64d3 修复）。硬件 runner 挂上后本 job 无需改动即为可信口径。
#
# 与其它工作流的关系：与 ci.yml 互不阻塞（本工作流失败说明 GPU 回归，
# 不拦普通提交；需要变闸门时靠分支保护把对应 job 设为 required）。
# 产物：bench-results/present-4k-*.txt 上传 7 天，硬件接上后同位对齐。
# ─────────────────────────────────────────────────────────────────────────────
name: gpu-present

on:
  push:
    branches: [main]
    paths:
      - "gfx/**"
      - "cmd/gox/gpu_present_init.go"
      - "scripts/bench-present-4k.sh"
      - "scripts/gpu-track-audit.sh"
      - ".github/workflows/gpu-present.yml"
  pull_request:
    paths:
      - "gfx/**"
      - "scripts/bench-present-4k.sh"
      - ".github/workflows/gpu-present.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-present-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 无硬件兜底口径：单元测试 + 三轨核销 + 4K A/B 基准 + 像素级 A/B ──
  no-hardware:
    name: 兜底口径 (软件适配器, 不进闸门)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Xvfb: 4K 呈现基准需要 4K 虚拟屏（脚本内会自带 xvfb-run）
      - name: 安装 Xvfb 与确定性字体
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb fonts-dejavu-core fonts-noto-cjk
        # 字体为什么必须装：26 组件 A/B 的「CPU 参照帧近乎空白」守卫要求
        # 画面 ≥8 种颜色。GitHub ubuntu-latest runner 的系统字体极贫瘠，
        # 文本密集组件 (list-item) 实测只有 5 色 / 2176 墨，守卫误杀
        # （2026-11-18 run 44358549554），而像素 A/B 本身差异仍为 0 ——
        # 是环境问题不是 GPU 轨问题。装 DejaVu + Noto CJK 与本地沙箱同源。

      # 注意: shell 必须显式 bash + pipefail —— `go test | tee` 管道默认取
      # tee 的退出码, 测试红了步骤照样绿 (2026-11-18 run 44358549554 实测:
      # TestGPUSnapshotAB26/list-item FAIL 而工作流整体 success)。闸门
      # 吞退出码等于没有闸门。

      # 0) 脚本可执行位守卫 —— Git Data API 重建 tree 丢 mode 已经两次踩坑
      #    (04:33 dee1c301 修复过一次, 22:00 730a143 经 API 推码又写回 100644,
      #    run 44541248538 audit step exit 126, main 闸门红一夜)。放在最前:
      #    把「permission denied」翻成一句能定位病因的诊断, 而不是让后续
      #    step 莫名 exit 126。只查本 workflow 以 ./ 直接执行的两个脚本 ——
      #    仓库另有 auto-release.sh 等 644 口径脚本 (一律 bash xxx.sh 调用),
      #    不在本守卫范围, 收窄避免误杀。Git Data API 推码时 tree entry
      #    mode 必须写 100755 是流程纪律, 守卫只负责在 CI 侧钉住。
      - name: 脚本可执行位守卫 (Git Data API 丢 mode 防再犯)
        shell: bash
        run: |
          fail=0
          for f in scripts/gpu-track-audit.sh scripts/bench-present-4k.sh; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error::$f 在 git tree 中 mode=$mode (缺可执行位) —— Git Data API 建 tree 时 entry mode 必须写 100755 (第二次踩坑: 730a143 → run 44541248538 exit 126)"
              fail=1
            fi
          done
          exit $fail

      # 1) 单元测试（含像素级 A/B TestGPUPresentPixelExact，软件后端即可验零退化）
      #    -skip 掉 TestGPUSnapshotAB26: 26 组件 A/B 由下面 1.5 的独立 step
      #    专跑 (带崩溃 flake 重跑语义), 这里再跑一遍纯属重复 —— 且会让
      #    全量 step 额外暴露在已知的 wgpu-software 崩溃 flake 上
      #    (2026-11-19 run 44391316067 checkbox 段错误, 详见 1.5 注释)。
      #    TestGPUSnapshotABGate (skip 判据钉子) 便宜且稳定, 保留在本 step。
      - name: go test -tags gpu ./gfx/gpu
        shell: bash
        run: set -o pipefail; go test -tags gpu ./gfx/gpu -skip '^TestGPUSnapshotAB26$' -v 2>&1 | tee gpu-test.txt

      # 1.5) G-4 视觉闸门：26 组件 CPU vs GPU 双轨像素级 A/B
      #      （gfx/gpu/snapshot_ab_test.go，表驱动，差异阈值 0）。软件适配器
      #      是确定性后端，视觉闸门跑在它上面不需要显卡；skip 判据被
      #      TestGPUSnapshotABGate 钉住，不是裸 if。产物单列一份，便于
      #      「G-4 双轨对照真跑过一次」留证。
      #
      #      重跑语义 (2026-11-20 接入, 口径纪律): CI runner 上 wgpu-software
      #      偶发段错误 (run 44391316067 TestGPUSnapshotAB26/checkbox core
      #      dumped; 本地沙箱连跑 10 次 0 复现, 属 runner Mesa/软件适配器
      #      环境特有)。仅当输出含 "signal:" (测试进程崩溃) 才允许重跑一次;
      #      像素差异 / 断言 FAIL 永不重试 —— 崩溃是环境 flake, FAIL 是
      #      闸门语义, 两者混为一谈重跑就等于闸门弱化。
      - name: 26 组件双轨快照 A/B (G-4 视觉闸门; 仅崩溃 flake 限一次重跑)
        shell: bash
        run: |
          set -o pipefail
          run_ab() { go test -tags gpu ./gfx/gpu -run TestGPUSnapshotAB -v 2>&1 | tee gpu-snapshot-ab.txt; }
          if run_ab; then exit 0; fi
          if grep -q "signal:" gpu-snapshot-ab.txt; then
            echo "::warning::wgpu-software 测试进程崩溃 (已知 runner 环境偶发 flake), 按口径重跑一次"
            run_ab
          else
            echo "::error::像素 A/B 闸门 FAIL (非崩溃): 不重试, 视觉一致性不许拿重跑洗白"
            exit 1
          fi

      # 1.6) x11 swapchain 端到端点亮 (A 路径硬前提 #2 接线验证):
      #      真平台窗口 + wgpu-software XPutImage 上屏 → XGetImage 读回
      #      窗口像素逐点比对 (2026-11-19 接入; 本 step 抓到并修复了
      #      窗口化路径红蓝互换的 BGRA 格式缺陷, 见 docs/gpu-track-audit.md
      #      2026-11-19 06:00 节)。必须独立进程 (GOX_GPU_X11_E2E=1 闸门):
      #      与其它测试同进程会触发上游 goffi/wgpu-software 段错误。
      #      口径: 仍属兜底口径 —— 钉接线正确性, 不产生性能数字。
      - name: x11 swapchain 端到端点亮 (独立进程, 兜底口径)
        shell: bash
        run: set -o pipefail; GOX_GPU_X11_E2E=1 xvfb-run -a -s "-screen 0 1280x800x24" go test -tags gpu ./gfx/gpu -run TestSwapchainX11WindowE2E -v 2>&1 | tee gpu-swapchain-e2e.txt

      # 2) 三轨核销表：每条构建轨在这台 runner 上实际走的路径（可审计）
      - name: scripts/gpu-track-audit.sh
        shell: bash
        run: set -o pipefail; ./scripts/gpu-track-audit.sh 2>&1 | tee gpu-track-audit.txt

      # 3) 4K 呈现基准：CPU blit vs GPU 合成同口径对照。
      #    显式声明兜底口径，防止数字被误读为硬件性能。
      - name: bench-present-4k.sh (兜底口径)
        shell: bash
        run: |
          set -o pipefail
          ./scripts/bench-present-4k.sh 2>&1 | tee gpu-bench-full.txt
          echo "::notice::以下 GPU 数字为无硬件兜底口径（wgpu-software），不进闸门、不对外"

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-present-no-hardware
          path: |
            gpu-test.txt
            gpu-snapshot-ab.txt
            gpu-swapchain-e2e.txt
            gpu-track-audit.txt
            gpu-bench-full.txt
            bench-results/present-4k-*.txt
          retention-days: 7

  # ── 硬件可信口径：占位。self-hosted runner 打 [gpu-hardware] 标签即启用；
  #    当前仓库没有这类 runner，job 恒 skip —— 不会因为缺 runner 而报红。
  #    skip 守卫用仓库变量（Settings → Variables → Actions）：挂上硬件
  #    runner 后置 GPU_HARDWARE_RUNNER=true 即启用本 job；不设置则直接
  #    skip。不能只靠 runs-on 标签守卫 —— 标签不匹配时 job 会停在
  #    queued 直到 timeout 报红（2026-11-15 首跑实测踩中）。
  hardware:
    name: 硬件口径 (可信, 进闸门候选)
    if: vars.GPU_HARDWARE_RUNNER == 'true'
    runs-on: [self-hosted, gpu-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 三轨核销 + 4K 基准 (硬件)
        shell: bash
        run: |
          set -o pipefail
          ./scripts/gpu-track-audit.sh 2>&1 | tee gpu-track-audit-hw.txt
          ./scripts/bench-present-4k.sh 2>&1 | tee gpu-bench-hw.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-present-hardware
          path: |
            gpu-track-audit-hw.txt
            gpu-bench-hw.txt
            bench-results/present-4k-*.txt
          retention-days: 90
